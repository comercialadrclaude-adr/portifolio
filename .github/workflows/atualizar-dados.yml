name: Atualizar dados (OneDrive)

# Baixa os KMZ da pasta do OneDrive da empresa, gera os dados agregados, testa e publica.
# Roda sob demanda (botão "Atualizar dados" no painel → "Run workflow") e em dias úteis.
# Configuração: docs/ONEDRIVE.md (segredos AZURE_* e ONEDRIVE_LINK_PASTA).

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1-5' # 06:17 em Brasília, segunda a sexta

permissions:
  contents: write # commit de public/data na main
  actions: write # dispara o deploy do site

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar se a conexão com o OneDrive está configurada
        id: cfg
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ONEDRIVE_LINK_PASTA: ${{ secrets.ONEDRIVE_LINK_PASTA }}
        run: |
          faltando=""
          for v in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET ONEDRIVE_LINK_PASTA; do
            [ -z "${!v}" ] && faltando="$faltando $v"
          done
          if [ -n "$faltando" ]; then
            msg="Conexão com o OneDrive ainda não configurada. Faltam os segredos:$faltando. Veja docs/ONEDRIVE.md."
            echo "### $msg" >> "$GITHUB_STEP_SUMMARY"
            # Na execução agendada só avisa; no botão, falha para o usuário ver o motivo.
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "::error::$msg"; exit 1; fi
            echo "::warning::$msg"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ok == 'true'
        with:
          ref: main

      - uses: actions/setup-python@v5
        if: steps.cfg.outputs.ok == 'true'
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependências
        if: steps.cfg.outputs.ok == 'true'
        run: pip install -r scripts/requirements.txt

      - name: Baixar KMZ do OneDrive
        if: steps.cfg.outputs.ok == 'true'
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ONEDRIVE_LINK_PASTA: ${{ secrets.ONEDRIVE_LINK_PASTA }}
        run: python scripts/baixar_onedrive.py --destino data/raw

      - name: Gerar dados (só agregados)
        if: steps.cfg.outputs.ok == 'true'
        run: python scripts/build_dataset.py

      - name: Testes (regras e privacidade)
        if: steps.cfg.outputs.ok == 'true'
        run: python -m pytest -q

      - name: Publicar public/data se mudou
        id: publicar
        if: steps.cfg.outputs.ok == 'true'
        run: |
          git add public/data
          if git diff --cached --quiet; then
            echo "Dados iguais aos publicados; nada a fazer." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "mudou=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "dados: atualização automática a partir do OneDrive ($(date -u +%d/%m/%Y))"
          git push origin HEAD:main
          echo "mudou=true" >> "$GITHUB_OUTPUT"

      - name: Publicar o site
        if: steps.publicar.outputs.mudou == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # Commits feitos com o GITHUB_TOKEN não disparam outros workflows; o deploy é chamado aqui.
        run: gh workflow run deploy.yml --ref main

      - name: Resumo
        if: steps.cfg.outputs.ok == 'true'
        run: |
          python - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          m = json.load(open("public/data/manifest.json"))
          i = json.load(open("public/data/indicadores.json"))["todos"]
          print("### Dados processados")
          print(f"- Base cadastral até: {m.get('dados_ate')}")
          print(f"- Trechos: {i['trechos']} · rede: {i['rede_km']:.1f} km · extensões: {i['extensoes_km']:.1f} km")
          print(f"- Projetos: {m['contagens']['projetos']}")
          for a in m.get("avisos", []):
              print(f"- Aviso: {a}")
          PY
