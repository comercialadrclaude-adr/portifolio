<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Painel de Extensões de Rede R4: rede cadastrada, extensões, carteira de projetos e qualidade do cadastro da Regional R4 – Interior (RJ)."
    />
    <meta name="theme-color" content="#0B4F71" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Painel de Extensões de Rede R4</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fontes sem bloquear a primeira pintura -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      />
    </noscript>
    <!-- Dados da aba inicial começam a baixar junto com o JS -->
    <link rel="preload" href="./data/manifest.json" as="fetch" crossorigin="anonymous" />
    <link rel="preload" href="./data/indicadores.json" as="fetch" crossorigin="anonymous" />
    <script>
      // Aplica o tema antes da primeira pintura (evita piscar).
      (function () {
        var pref = 'sistema';
        try {
          pref = localStorage.getItem('tema') || 'sistema';
        } catch (e) {}
        var escuro =
          pref === 'escuro' ||
          (pref === 'sistema' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', escuro ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
